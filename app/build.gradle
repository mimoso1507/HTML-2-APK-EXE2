plugins { id 'com.android.application' }
// En GitHub Actions se pasa -Pvcode=<minutos desde 1970> para que cada versión nueva se instale encima de la anterior.
def vc = Integer.parseInt((project.findProperty('vcode') ?: '1').toString())
android {
    namespace 'com.h2a.converter'
    compileSdk 34
    defaultConfig {
        applicationId 'com.h2a.converter'
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName '1.' + vc
    }
    signingConfigs {
        debug {
            storeFile file('src/main/assets/h2a.p12')
            storePassword 'h2apass'
            keyAlias 'h2a'
            keyPassword 'h2apass'
            storeType 'pkcs12'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
dependencies {
    implementation 'com.android.tools.build:apksig:8.5.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.12.0' // FileProvider
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
