plugins { id 'com.android.application' }
android {
    namespace 'com.h2a.template'
    compileSdk 34
    defaultConfig {
        applicationId 'com.h2a.placeholderpackage'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName 'H2A_VERSIONNAME'
    }
    buildTypes { release { minifyEnabled false; shrinkResources false } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
